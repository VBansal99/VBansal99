<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0A1026"/><stop offset=".55" stop-color="#070B17"/><stop offset="1" stop-color="#1A0510"/>
  </linearGradient>
  <radialGradient id="glow" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#E0183A" stop-opacity=".35"/><stop offset="1" stop-color="#E0183A" stop-opacity="0"/>
  </radialGradient>
  <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#fff" opacity=".035"/></pattern>
  <linearGradient id="sweep" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#22D3EE" stop-opacity="0"/><stop offset=".5" stop-color="#22D3EE" stop-opacity=".12"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
  </linearGradient>
  <clipPath id="frame"><rect width="1200" height="400" rx="18"/></clipPath>
</defs>
<style>
  .t { font-family:Impact, 'Haettenschweiler', 'Arial Narrow Bold', 'Arial Black', sans-serif; font-size:124px; letter-spacing:6px; text-anchor:middle; }
  .g1 { fill:#22D3EE; animation: g1 4s infinite steps(1); mix-blend-mode:screen; }
  .g2 { fill:#E0183A; animation: g2 4s infinite steps(1); mix-blend-mode:screen; }
  @keyframes g1 { 0%{transform:translate(-4px,0)} 88%{transform:translate(-4px,0)} 90%{transform:translate(-18px,3px)} 92%{transform:translate(9px,-2px)} 94%{transform:translate(-4px,0)} }
  @keyframes g2 { 0%{transform:translate(4px,0)} 88%{transform:translate(4px,0)} 90%{transform:translate(16px,-3px)} 92%{transform:translate(-10px,2px)} 94%{transform:translate(4px,0)} }
  .main { fill:#F2F4F8; animation: flick 4s infinite steps(1); }
  @keyframes flick { 0%{opacity:1} 90%{opacity:.55} 91%{opacity:1} 93%{opacity:.7} 94%{opacity:1} }
  .sub { font-family:'Consolas', 'Menlo', monospace; font-size:19px; letter-spacing:5px; fill:#8B95B0; text-anchor:middle; }
  .hud { font-family:'Consolas', 'Menlo', monospace; font-size:13px; letter-spacing:2px; fill:#8B95B0; }
  .blink { animation: bl 1.2s infinite; } @keyframes bl { 50%{opacity:.15} }
  .sw { animation: sw 5s linear infinite; } @keyframes sw { from{transform:translateY(-160px)} to{transform:translateY(400px)} }
  .bar { transform-origin:600px 0; animation: bar 2.4s ease-out both; } @keyframes bar { from{transform:scaleX(0)} to{transform:scaleX(1)} }
  .web { animation: wb 6s ease-in-out infinite; } @keyframes wb { 50%{opacity:.45} }
  @media (prefers-reduced-motion: reduce) { * { animation:none !important; } }
</style>
