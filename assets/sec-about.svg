<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 76" width="100%">
<style>
  .c { font-family:'Consolas', 'Menlo', monospace; font-size:15px; fill:#F2F4F8; letter-spacing:2px; }
  .t { font-family:Impact, 'Haettenschweiler', 'Arial Narrow Bold', 'Arial Black', sans-serif; font-size:36px; fill:#F2F4F8; letter-spacing:3px; }
  .g { font-family:'Consolas', 'Menlo', monospace; font-size:12px; fill:#8B95B0; letter-spacing:2px; }
  .p { animation:p 2.4s infinite; } @keyframes p { 50%{opacity:.2} }
  .s { animation:s 3s ease-in-out infinite; transform-origin:0 0; } @keyframes s { 0%,100%{transform:translateX(0)} 50%{transform:translateX(26px)} }
  @media (prefers-reduced-motion: reduce) { * { animation:none !important; } }
</style>
<polygon points="0,8 860,8 900,68 0,68" fill="#070B17"/>
<polygon points="0,8 110,8 90,68 0,68" fill="#E0183A"/>
<text class="c" x="18" y="43.0">FILE</text>
<text class="t" x="118" y="51.0">WHO'S BEHIND THE MASK</text>
<g stroke="#22D3EE" stroke-width="1" opacity=".5"><line class="s" x1="670" y1="38.0" x2="780" y2="38.0" stroke-dasharray="3 6"/></g>
<circle class="p" cx="800" cy="38.0" r="4" fill="#E0183A"/>
<text class="g" x="812" y="42.0">ID</text>
<rect x="0" y="68" width="900" height="2" fill="#E0183A" opacity=".7"/>
</svg>