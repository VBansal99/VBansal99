name: Visor sync

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours, off the top of the hour when GitHub's queue is busiest
  workflow_dispatch:          # "Run workflow" button
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/visor-sync.yml"
      - "assets/*.svg"        # a redesigned panel gets its live strip right away

permissions:
  contents: write

# one sync at a time; a queued run waits instead of racing the push
concurrency:
  group: visor-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # the bot's own commits touch assets/*.svg too; don't let them start another run
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install
        run: pip install -r scripts/requirements.txt

      - name: Build live panels
        working-directory: scripts
        env:
          # optional: a VISOR_TOKEN secret (fine-grained, read-only) lets private
          # contributions count; without it the built-in token is used
          GITHUB_TOKEN: ${{ secrets.VISOR_TOKEN || secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: |
          python hud_stats.py
          python live_overlays.py

      - name: Draw patrol route
        uses: Platane/snk/svg-only@v3
        continue-on-error: true   # a snake outage should not hold back the other panels
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/patrol.svg?color_snake=#FF2D46&color_dots=#0B1120,#3B0E1A,#7A1628,#C21F37,#FF2D46&color_dot_border=#1B2540

      - name: Check every panel still opens
        run: |
          python - <<'PY'
          import pathlib, sys
          from xml.dom import minidom
          bad = []
          for p in sorted(pathlib.Path("assets").glob("*.svg")):
              try:
                  minidom.parse(str(p))
              except Exception as e:
                  bad.append(f"{p.name}: {e}")
          if bad:
              print("\n".join(bad)); sys.exit(1)
          print("all panels are valid SVG")
          PY

      - name: Fail if nothing could be fetched
        run: |
          s="$GITHUB_STEP_SUMMARY"
          if grep -q "kept last good" "$s" && ! grep -q "| updated |" "$s"; then
            echo "::error::Every GitHub fetch failed. Check the token and the log above."
            exit 1
          fi

      - name: Commit
        run: |
          git config user.name "visor-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          if git diff --staged --quiet; then
            echo "nothing changed"; exit 0
          fi
          git commit -m "visor sync $(date -u +'%d %b %H:%M UTC')"
          for i in 1 2 3; do
            git pull --rebase --quiet && git push && exit 0
            echo "push attempt $i failed, retrying"; sleep $((i * 5))
          done
          exit 1
